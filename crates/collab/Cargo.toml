[package]
name = "gridcraft-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dexterity Sheets LAN co-authoring: workbook patches, wire protocol, client and server"

[lints]
workspace = true

[dependencies]
gridcraft-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
flate2 = "1.1"
getrandom = "0.3"
chrono = { workspace = true, features = ["clock"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Ed25519 device keys: each PC signs in with its own key instead of a password.
ring = "0.17"
