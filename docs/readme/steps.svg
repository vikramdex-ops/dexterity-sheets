<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Three steps: Install, Sign in, Edit together</title>
<desc id="d">1. Install: run the setup, no admin rights needed. 2. Sign in: pick the office server and type your name. 3. Edit together: open a shared workbook.</desc>
<!-- Original artwork by Dexterity Design Services Pvt. Ltd. -->
<defs>
<style>text{font-family:'Segoe UI', 'Segoe UI Variable Text', Arial, Helvetica, sans-serif}.cn{stroke-dasharray:6 10;animation:cn 1.2s linear infinite}@keyframes cn{to{stroke-dashoffset:-16}}.tr{opacity:0;animation:tr 8s ease-in-out infinite}@keyframes tr{0%,8%{opacity:0;transform:translateX(0)}10%{opacity:1}34%{opacity:1;transform:translateX(256px)}36%,100%{opacity:0;transform:translateX(256px)}}.t2{animation-delay:-5.12s}.pu{opacity:0;animation:pu 8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%{opacity:.9;transform:scale(1)}14%,100%{opacity:0;transform:scale(1.45)}}.s2{animation-delay:-5.12s}.s3{animation-delay:-2.40s}.ar1{animation:ar1 1.6s ease-in-out infinite}@keyframes ar1{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}.hd{animation:hd 3s ease-in-out infinite}@keyframes hd{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.c1{animation:c1 4s ease-in-out infinite}@keyframes c1{0%,15%{transform:translate(0,0)}35%,60%{transform:translate(22px,0)}80%,100%{transform:translate(0,0)}}.c2{animation:c2 4s ease-in-out infinite}@keyframes c2{0%,10%{transform:translate(0,0)}30%,55%{transform:translate(-22px,-17px)}75%,100%{transform:translate(0,0)}}.fl{animation:fl 6s ease-in-out infinite}.fl2{animation-delay:-2s}.fl3{animation-delay:-4s}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f428f"/><stop offset=".6" stop-color="#082866"/><stop offset="1" stop-color="#051a45"/></linearGradient>
<radialGradient id="gl" cx="600" cy="110" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3b7bff" stop-opacity=".35"/><stop offset="1" stop-color="#3b7bff" stop-opacity="0"/></radialGradient>
<linearGradient id="disc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a63c9"/><stop offset="1" stop-color="#0b2f72"/></linearGradient>
<filter id="ds" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020a1f" flood-opacity=".55"/></filter>
<filter id="gw" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cl"><rect width="1200" height="300" rx="24"/></clipPath>
</defs>
<g clip-path="url(#cl)">
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#gl)"/>
<path class="cn" d="M272 112H528" stroke="#8fb6ff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/><path d="M520 104l8 8-8 8" stroke="#8fb6ff" stroke-opacity=".7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="tr" cx="272" cy="112" r="7" fill="#fff" filter="url(#gw)"/><path class="cn" d="M672 112H928" stroke="#8fb6ff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/><path d="M920 104l8 8-8 8" stroke="#8fb6ff" stroke-opacity=".7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="tr t2" cx="672" cy="112" r="7" fill="#fff" filter="url(#gw)"/><circle class="pu s1" cx="200" cy="112" r="58" fill="none" stroke="#8fb6ff" stroke-width="3"/><g class="fl fl1"><circle cx="200" cy="112" r="58" fill="url(#disc)" stroke="#fff" stroke-opacity=".22" stroke-width="2" filter="url(#ds)"/><g transform="translate(200 112)"><g class="ar1"><path d="M0-30V6m-14-14L0 6l14-14" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M-26 8V22H26V8" stroke="#bcd3ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="156" cy="68" r="17" fill="#fff"/><text x="156" y="74.5" text-anchor="middle" font-size="19" font-weight="800" fill="#0d3b8c">1</text></g><text x="200" y="222" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Install</text><text x="200" y="256" text-anchor="middle" font-size="18" fill="#a9c6f7">Run the setup. No admin rights needed.</text><circle class="pu s2" cx="600" cy="112" r="58" fill="none" stroke="#8fb6ff" stroke-width="3"/><g class="fl fl2"><circle cx="600" cy="112" r="58" fill="url(#disc)" stroke="#fff" stroke-opacity=".22" stroke-width="2" filter="url(#ds)"/><g transform="translate(600 112)"><g class="hd"><circle cx="0" cy="-12" r="13" fill="#fff"/></g><path d="M-24 28a24 22 0 0 1 48 0z" fill="#fff"/><circle cx="21" cy="12" r="11" fill="#2ca02c" stroke="#0b2f72" stroke-width="3"/><path d="M15.5 12l4 4 7-7.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="556" cy="68" r="17" fill="#fff"/><text x="556" y="74.5" text-anchor="middle" font-size="19" font-weight="800" fill="#0d3b8c">2</text></g><text x="600" y="222" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Sign in</text><text x="600" y="256" text-anchor="middle" font-size="18" fill="#a9c6f7">Pick the office server, type your name.</text><circle class="pu s3" cx="1000" cy="112" r="58" fill="none" stroke="#8fb6ff" stroke-width="3"/><g class="fl fl3"><circle cx="1000" cy="112" r="58" fill="url(#disc)" stroke="#fff" stroke-opacity=".22" stroke-width="2" filter="url(#ds)"/><g transform="translate(1000 112)"><rect x="-30" y="-24" width="60" height="50" rx="5" fill="#fff"/><path d="M-30-10H30M-30 7H30M-8-24V26M14-24V26" stroke="#c9d5ea" stroke-width="1.5"/><rect x="-30" y="-24" width="60" height="7" rx="3" fill="#0d3b8c"/><g class="c1"><rect x="-29" y="-9" width="21" height="15" rx="1.5" fill="#d62728" fill-opacity=".15" stroke="#d62728" stroke-width="2.6"/></g><g class="c2"><rect x="-7" y="8" width="21" height="17" rx="1.5" fill="#2ca02c" fill-opacity=".15" stroke="#2ca02c" stroke-width="2.6"/></g></g><circle cx="956" cy="68" r="17" fill="#fff"/><text x="956" y="74.5" text-anchor="middle" font-size="19" font-weight="800" fill="#0d3b8c">3</text></g><text x="1000" y="222" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Edit together</text><text x="1000" y="256" text-anchor="middle" font-size="18" fill="#a9c6f7">Open a shared workbook. That's it.</text>
</g>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
</svg>
