<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="t d">
<title id="t">Updates itself</title>
<desc id="d">One click installs the new version. No admin rights. An Update now button is clicked; the new version comes from the office server and installs.</desc>
<!-- Original artwork by Dexterity Design Services Pvt. Ltd. -->
<defs>
<style>text{font-family:'Segoe UI', 'Segoe UI Variable Text', Arial, Helvetica, sans-serif}.rgp{stroke-dasharray:251.3;animation:rgp 6s ease-in-out infinite}@keyframes rgp{0%,14%{stroke-dashoffset:251.3}62%,90%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:251.3;opacity:0}}.ar{opacity:0;animation:ar 6s ease-in-out infinite}@keyframes ar{0%,12%{opacity:1;transform:translateY(-5px)}20%,36%,52%{opacity:1;transform:translateY(3px)}28%,44%{opacity:1;transform:translateY(-3px)}62%,100%{opacity:0;transform:translateY(3px)}}.ck{animation:ck 6s ease-out infinite;stroke-dasharray:60}@keyframes ck{0%,62%{stroke-dashoffset:60;opacity:1}70%,90%{stroke-dashoffset:0;opacity:1}96%,100%{opacity:0}}.b1{opacity:0;animation:b1 6s infinite}@keyframes b1{0%,62%{opacity:1}64%,95%{opacity:0}98%,100%{opacity:1}}.b2{animation:b2 6s infinite}@keyframes b2{0%,62%{opacity:0}64%,95%{opacity:1}98%,100%{opacity:0}}.pr{animation:pr 6s infinite;transform-box:fill-box;transform-origin:center}@keyframes pr{0%,6%,12%,100%{transform:scale(1)}9%{transform:scale(.93)}}.cu{opacity:0;animation:cu 6s ease-in-out infinite}@keyframes cu{0%{transform:translate(26px,26px);opacity:0}4%{opacity:1}8%,11%{transform:translate(0,0);opacity:1}20%,100%{transform:translate(18px,30px);opacity:0}}.dt{stroke-dasharray:2 8;animation:dt .9s linear infinite}@keyframes dt{to{stroke-dashoffset:-10}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f428f"/><stop offset=".6" stop-color="#082866"/><stop offset="1" stop-color="#051a45"/></linearGradient>
<radialGradient id="gl" cx="200" cy="90" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3b7bff" stop-opacity=".42"/><stop offset="1" stop-color="#3b7bff" stop-opacity="0"/></radialGradient>
<filter id="ds" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020a1f" flood-opacity=".5"/></filter>
<clipPath id="cl"><rect width="400" height="260" rx="20"/></clipPath>

</defs>
<g clip-path="url(#cl)">
<rect width="400" height="260" fill="url(#bg)"/>
<rect width="400" height="260" fill="url(#gl)"/>
<path d="M0 184H400" stroke="#fff" stroke-opacity=".08"/>
<g transform="translate(40 50)"><rect width="64" height="84" rx="8" fill="#0b2a63" stroke="#8fb6ff" stroke-opacity=".5" stroke-width="1.5"/><rect x="10" y="12" width="44" height="14" rx="3" fill="#163e86"/><rect x="10" y="34" width="44" height="14" rx="3" fill="#163e86"/><rect x="10" y="56" width="44" height="14" rx="3" fill="#163e86"/><circle cx="46" cy="19" r="2.5" fill="#56d364"/><circle cx="46" cy="41" r="2.5" fill="#56d364"/><circle cx="46" cy="63" r="2.5" fill="#4fa3ff"/><text x="32" y="104" text-anchor="middle" font-size="11.5" fill="#a9c6f7">Office server</text></g><path class="dt" d="M112 92H166" stroke="#bcd3ff" stroke-width="3" stroke-linecap="round"/><circle cx="214" cy="92" r="40" fill="#061a45" stroke="#fff" stroke-opacity=".14" stroke-width="7"/><circle class="rgp" cx="214" cy="92" r="40" fill="none" stroke="#4fa3ff" stroke-width="7" stroke-linecap="round" transform="rotate(-90 214 92)"/><g class="ar"><path d="M214 74v30m-11-11 11 11 11-11" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path class="ck" d="M198 93l11 11 21-22" stroke="#56d364" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="pr"><rect x="272" y="78" width="96" height="30" rx="15" fill="#fff"/><text class="b1" x="320" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#0d3b8c">Update now</text><text class="b2" x="320" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#17803a">Up to date</text></g><g transform="translate(330 100)"><g class="cu"><path d="M0 0V17l4.5-4.2 3 6.6 3-1.4-3-6.4H14z" fill="#fff" stroke="#0d3b8c" stroke-width="1.4" stroke-linejoin="round"/></g></g>
<text x="200" y="217" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Updates itself</text>
<text x="200" y="242" text-anchor="middle" font-size="14.5" fill="#a9c6f7">One click installs the new version. No admin rights.</text>
</g>
