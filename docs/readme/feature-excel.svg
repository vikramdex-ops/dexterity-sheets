<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="t d">
<title id="t">Excel files in and out</title>
<desc id="d">Open the .xlsx a client sends. Save .xlsx back. Cells flow into a workbook file marked .xlsx and flow out again.</desc>
<!-- Original artwork by Dexterity Design Services Pvt. Ltd. -->
<defs>
<style>text{font-family:'Segoe UI', 'Segoe UI Variable Text', Arial, Helvetica, sans-serif}.dc{animation:dc 5s ease-in-out infinite}@keyframes dc{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.mi,.mo{animation:mv 2.4s linear infinite}.mo{animation-name:mo}@keyframes mv{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(66px);opacity:0}}@keyframes mo{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(66px);opacity:0}}.k2{animation-delay:-.8s}.k3{animation-delay:-1.6s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f428f"/><stop offset=".6" stop-color="#082866"/><stop offset="1" stop-color="#051a45"/></linearGradient>
<radialGradient id="gl" cx="200" cy="90" r="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3b7bff" stop-opacity=".42"/><stop offset="1" stop-color="#3b7bff" stop-opacity="0"/></radialGradient>
<filter id="ds" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020a1f" flood-opacity=".5"/></filter>
<clipPath id="cl"><rect width="400" height="260" rx="20"/></clipPath>

</defs>
<g clip-path="url(#cl)">
<rect width="400" height="260" fill="url(#bg)"/>
<rect width="400" height="260" fill="url(#gl)"/>
<path d="M0 184H400" stroke="#fff" stroke-opacity=".08"/>
<path d="M52 92H128" stroke="#8fb6ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 5"/><path d="M122 85l8 7-8 7" stroke="#8fb6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a9c6f7">Open</text><rect class="mi" x="52" y="86" width="12" height="12" rx="2.5" fill="#fff" fill-opacity=".85"/><rect class="mi k2" x="52" y="86" width="12" height="12" rx="2.5" fill="#fff" fill-opacity=".85"/><rect class="mi k3" x="52" y="86" width="12" height="12" rx="2.5" fill="#fff" fill-opacity=".85"/><path d="M262 92H338" stroke="#8fb6ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 5"/><path d="M332 85l8 7-8 7" stroke="#8fb6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a9c6f7">Save as</text><rect class="mo" x="262" y="86" width="12" height="12" rx="2.5" fill="#fff" fill-opacity=".85"/><rect class="mo k2" x="262" y="86" width="12" height="12" rx="2.5" fill="#fff" fill-opacity=".85"/><rect class="mo k3" x="262" y="86" width="12" height="12" rx="2.5" fill="#fff" fill-opacity=".85"/><g class="dc"><g filter="url(#ds)"><path d="M150 26H226L254 54V156a6 6 0 0 1-6 6H150a6 6 0 0 1-6-6V32a6 6 0 0 1 6-6z" fill="#fbfcff"/></g><path d="M226 26V48a6 6 0 0 0 6 6H254" fill="#dbe5f5"/><path d="M156 66H242M156 86H242M156 106H242M156 126H242M184 66V140M213 66V140" stroke="#c9d5ea"/><rect x="156" y="58" width="86" height="8" rx="2" fill="#0d3b8c" fill-opacity=".85"/><rect x="161" y="73" width="18" height="6" rx="3" fill="#b9c7de"/><rect x="189" y="73" width="20" height="6" rx="3" fill="#b9c7de"/><rect x="218" y="93" width="18" height="6" rx="3" fill="#b9c7de"/><rect x="161" y="113" width="16" height="6" rx="3" fill="#b9c7de"/><rect x="189" y="93" width="14" height="6" rx="3" fill="#b9c7de"/><rect x="132" y="132" width="64" height="26" rx="7" fill="#0d3b8c" stroke="#fff" stroke-width="2"/><text x="164" y="150.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">.xlsx</text></g>
<text x="200" y="217" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Excel files in and out</text>
