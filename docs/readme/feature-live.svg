<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="t d">
<title id="t">Share any file, live</title>
<desc id="d">Your file stays put and keeps everyone's edits. Anita, Rahul and Vikram move around one shared sheet; each value they type appears for everyone.</desc>
