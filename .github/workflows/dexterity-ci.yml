name: Dexterity CI

# Tests and builds Dexterity Sheets. Runs on every push and pull request, and is called by the
# upstream sync before anything it merged is released.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: README, landing page, release notes and changelog match what ships (RULES.md §3)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          python3 packaging/dexterity/docs_check.py $base

  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dexterity hooks into upstream files are intact
        run: python packaging/dexterity/check_overlay.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (Dexterity crates and the app)
        run: cargo clippy --release --locked -p gridcraft-collab -p gridcraft-server -p gridcraft-server-manager -p gridcraft-ui-egui -p gridcraft --tests -- -D warnings
      - name: Collaboration and Server Manager tests (patches, convergence, real TCP server, bulk import, backups)
        run: cargo test --release --locked -p gridcraft-collab -p gridcraft-server-manager
      - name: Engine, formula and file-format tests
        run: cargo test --release --locked -p gridcraft-core -p gridcraft-numfmt -p gridcraft-formula -p gridcraft-functions -p gridcraft-model -p gridcraft-calc -p gridcraft-xlsx -p gridcraft-engine
      - name: Build app, CLI, server and Server Manager
        run: cargo build --release --locked -p gridcraft -p gridcraft-cli -p gridcraft-server -p gridcraft-server-manager
      - name: Three windows editing one shared workbook (end to end)
        # Real app windows on the runner's desktop (software rendering), sharing from a folder included.
        run: python packaging/dexterity/tests/lan_e2e.py target/release
      - name: Performance gate (start-up, memory, idle CPU, typing, a 2-million-cell file, memory given back)
        run: python packaging/dexterity/tests/perf_gate.py target/release --report tests/out/perf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: tests/out
          if-no-files-found: ignore
